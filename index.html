<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sport Agent">
<meta name="theme-color" content="#0a0a0a">
<title>Sport Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet">

<!-- ⚠️ SUPABASE JS CLIENT - Se carga desde CDN público -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --bg: #0a0a0a;
  --surface: #15161a;
  --surface-2: #1f2024;
  --border: #1f2024;
  --border-strong: #2a2b30;
  --text: #f4f1ec;
  --text-dim: #8a8680;
  --text-faint: #55524e;
  --primary: #3B82F6;
  --primary-dim: #2563eb;
  --green: #D9F264;
  --yellow: #FFB800;
  --red: #FF4D4D;
  --font: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
  --app-height: 100dvh;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-weight: 300;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  position: fixed;
  width: 100%;
  overscroll-behavior: none;
}

.app {
  display: flex;
  flex-direction: column;
  height: var(--app-height);
  max-width: 520px;
  margin: 0 auto;
  background: var(--bg);
  position: relative;
  overflow: hidden;
}

.hidden { display: none !important; }

/* ========== LOGIN SCREEN ========== */
.login-screen {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  height: var(--app-height);
  padding: 40px 32px;
  background: var(--bg);
  text-align: center;
}

.login-logo {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 32px;
  color: white;
  font-weight: 500;
  font-size: 28px;
  letter-spacing: -0.5px;
}

.login-title {
  font-size: 32px;
  font-weight: 200;
  letter-spacing: -1px;
  margin-bottom: 12px;
  color: var(--text);
}

.login-subtitle {
  font-size: 15px;
  font-weight: 300;
  color: var(--text-dim);
  margin-bottom: 48px;
  line-height: 1.5;
  max-width: 320px;
}

.login-buttons {
  width: 100%;
  max-width: 320px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.btn-login {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 100%;
  padding: 14px 20px;
  border-radius: 12px;
  font-family: var(--font);
  font-size: 15px;
  font-weight: 400;
  cursor: pointer;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text);
  transition: all 0.2s;
}

.btn-login:hover, .btn-login:active {
  background: var(--surface-2);
}

.btn-login svg {
  width: 20px;
  height: 20px;
}

.btn-login-primary {
  background: var(--primary);
  border-color: var(--primary);
  color: white;
}

.btn-login-primary:hover, .btn-login-primary:active {
  background: var(--primary-dim);
  border-color: var(--primary-dim);
}

.login-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 8px 0;
  color: var(--text-faint);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.login-divider::before, .login-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* ========== EMAIL FORM ========== */
.email-form {
  width: 100%;
  max-width: 320px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.email-input {
  width: 100%;
  padding: 14px 16px;
  border-radius: 12px;
  font-family: var(--font);
  font-size: 15px;
  font-weight: 400;
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border-strong);
  outline: none;
  transition: border-color 0.2s;
}

.email-input:focus {
  border-color: var(--primary);
}

.email-input::placeholder {
  color: var(--text-faint);
}

.login-error {
  color: var(--red);
  font-size: 13px;
  text-align: center;
  min-height: 18px;
  margin-top: 4px;
}

.login-back {
  margin-top: 24px;
  background: none;
  border: none;
  color: var(--text-dim);
  font-family: var(--font);
  font-size: 13px;
  cursor: pointer;
  padding: 8px;
}

.login-back:hover {
  color: var(--text);
}

.login-loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  color: var(--text-dim);
  font-size: 14px;
}

.spinner {
  width: 32px;
  height: 32px;
  border: 2px solid var(--border-strong);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ========== HEADER ========== */
.header {
  padding: max(env(safe-area-inset-top), 16px) 20px 14px;
  border-bottom: 1px solid var(--border);
  background: rgba(10,10,10,0.95);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 10;
  flex-shrink: 0;
}

.avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: 500;
  font-size: 14px;
  letter-spacing: -0.3px;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
  background-size: cover;
  background-position: center;
  transition: background 0.3s ease;
}

.avatar.thinking {
  background: var(--yellow);
  animation: pulse-thinking 1.4s ease-in-out infinite;
}

.avatar.error {
  background: var(--red);
}

@keyframes pulse-thinking {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255, 184, 0, 0.4); }
  50% { box-shadow: 0 0 0 8px rgba(255, 184, 0, 0); }
}

.header-info {
  flex: 1;
  min-width: 0;
}

.header-title {
  font-size: 15px;
  font-weight: 500;
  letter-spacing: -0.2px;
  color: var(--text);
}

.header-status {
  font-size: 12px;
  color: var(--text-dim);
  font-weight: 300;
  margin-top: 2px;
}

.header-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}

.btn-icon {
  background: none;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  padding: 8px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.btn-icon:hover, .btn-icon:active {
  background: var(--surface);
  color: var(--text);
}

.btn-icon svg {
  width: 18px;
  height: 18px;
}

/* ========== CONVERSATION ========== */
.conversation {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  scroll-behavior: smooth;
}

.day-marker {
  text-align: center;
  font-size: 11px;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin: 8px 0 4px;
  font-weight: 400;
}

.msg {
  display: flex;
  flex-direction: column;
  max-width: 88%;
  animation: msgIn 0.25s ease-out;
}

@keyframes msgIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.msg-user {
  align-self: flex-end;
  align-items: flex-end;
}

.msg-agent {
  align-self: flex-start;
  align-items: flex-start;
}

.msg-bubble {
  padding: 12px 16px;
  border-radius: 18px;
  font-size: 15px;
  line-height: 1.45;
  font-weight: 300;
  word-wrap: break-word;
  white-space: pre-wrap;
}

.msg-user .msg-bubble {
  background: var(--primary);
  color: white;
  border-bottom-right-radius: 6px;
}

.msg-agent .msg-bubble {
  background: var(--surface);
  color: var(--text);
  border-bottom-left-radius: 6px;
}

.msg-agent strong {
  color: var(--text);
  font-weight: 500;
}

.msg-error .msg-bubble {
  background: rgba(255, 77, 77, 0.1);
  color: var(--red);
  border: 1px solid rgba(255, 77, 77, 0.25);
}

.msg-time {
  font-size: 10px;
  color: var(--text-faint);
  margin-top: 4px;
  padding: 0 8px;
  letter-spacing: 0.3px;
}

.streaming-cursor {
  display: inline-block;
  width: 2px;
  height: 14px;
  background: var(--primary);
  margin-left: 2px;
  vertical-align: text-bottom;
  animation: blink 0.9s steps(2) infinite;
}

@keyframes blink {
  50% { opacity: 0; }
}

.typing {
  align-self: flex-start;
  background: var(--surface);
  padding: 14px 18px;
  border-radius: 18px;
  border-bottom-left-radius: 6px;
  display: flex;
  gap: 4px;
}

.typing span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--text-dim);
  animation: dot 1.4s infinite ease-in-out;
}

.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }

@keyframes dot {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-4px); opacity: 1; }
}

/* ========== VERDICT CARD ========== */
.verdict {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 16px;
  padding: 18px;
  margin: 4px 0;
  max-width: 100%;
  align-self: stretch;
  animation: msgIn 0.35s ease-out;
}

.v-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.v-status-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(255,255,255,0.04);
  padding: 6px 12px;
  border-radius: 100px;
}

.v-status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.v-status-dot.go { background: var(--green); box-shadow: 0 0 8px var(--green); }
.v-status-dot.caution { background: var(--yellow); box-shadow: 0 0 8px var(--yellow); }
.v-status-dot.stop { background: var(--red); box-shadow: 0 0 8px var(--red); }

.v-status-label {
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.3px;
}

.v-timestamp {
  font-size: 10px;
  color: var(--text-faint);
  letter-spacing: 0.5px;
}

.v-gauge {
  width: 100%;
  display: flex;
  justify-content: center;
  margin-bottom: 16px;
}

.v-gauge svg { width: 100%; max-width: 280px; height: auto; }

.v-metrics {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 16px;
  padding: 12px;
  background: rgba(255,255,255,0.02);
  border-radius: 10px;
}

.v-metric {
  display: flex;
  align-items: center;
  gap: 10px;
}

.v-metric-label {
  font-size: 11px;
  color: var(--text-dim);
  width: 80px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 400;
}

.v-metric-bar {
  flex: 1;
  height: 6px;
  background: rgba(255,255,255,0.05);
  border-radius: 3px;
  overflow: hidden;
}

.v-metric-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.6s ease;
}

.v-metric-value {
  font-size: 11px;
  color: var(--text-dim);
  width: 28px;
  text-align: right;
  font-variant-numeric: tabular-nums;
  font-weight: 400;
}

.v-section {
  margin-bottom: 12px;
}

.v-section-label {
  font-size: 10px;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 1.2px;
  margin-bottom: 8px;
  font-weight: 500;
}

.v-list {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.v-item {
  font-size: 13px;
  line-height: 1.4;
  color: var(--text);
  padding-left: 16px;
  position: relative;
  font-weight: 300;
}

.v-item::before {
  content: '';
  position: absolute;
  left: 0;
  top: 8px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
}

.v-item.do::before { background: var(--green); }
.v-item.avoid::before { background: var(--red); }

.v-warning {
  margin-top: 12px;
  padding: 10px 12px;
  background: rgba(255, 184, 0, 0.08);
  border-left: 2px solid var(--yellow);
  border-radius: 4px;
  font-size: 12px;
  color: var(--text);
  line-height: 1.4;
  font-weight: 400;
}

/* ========== INPUT BAR ========== */
.input-bar {
  padding: 12px 16px max(env(safe-area-inset-bottom), 16px);
  border-top: 1px solid var(--border);
  background: rgba(10,10,10,0.95);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  display: flex;
  align-items: flex-end;
  gap: 8px;
  z-index: 10;
  flex-shrink: 0;
}

.input-wrap {
  flex: 1;
  background: var(--surface);
  border-radius: 22px;
  display: flex;
  align-items: flex-end;
  padding: 8px 12px;
  min-height: 44px;
  border: 1px solid var(--border-strong);
  transition: border-color 0.15s;
}

.input-wrap:focus-within {
  border-color: var(--primary);
}

#inputField {
  flex: 1;
  background: none;
  border: none;
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  font-weight: 300;
  resize: none;
  outline: none;
  max-height: 100px;
  line-height: 1.4;
  padding: 6px 4px;
}

#inputField::placeholder {
  color: var(--text-faint);
}

.send-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--primary);
  border: none;
  color: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: opacity 0.2s, background 0.2s;
}

.send-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

.send-btn svg {
  width: 18px;
  height: 18px;
}

/* ========== ONBOARDING ========== */
.onboarding-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 100;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 40px 32px;
  text-align: center;
  max-width: 520px;
  margin: 0 auto;
}

.onboarding-overlay.hidden { display: none; }

.ob-title {
  font-size: 32px;
  font-weight: 200;
  letter-spacing: -1px;
  margin-bottom: 16px;
}

.ob-subtitle {
  font-size: 15px;
  color: var(--text-dim);
  margin-bottom: 48px;
  line-height: 1.5;
  max-width: 320px;
  font-weight: 300;
}

.ob-button {
  background: var(--primary);
  color: white;
  border: none;
  padding: 14px 32px;
  border-radius: 100px;
  font-family: var(--font);
  font-size: 15px;
  font-weight: 400;
  cursor: pointer;
  letter-spacing: 0.2px;
}

.ob-button:hover, .ob-button:active {
  background: var(--primary-dim);
}

/* ========== SCROLLBAR ========== */
.conversation::-webkit-scrollbar { width: 4px; }
.conversation::-webkit-scrollbar-track { background: transparent; }
.conversation::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }

</style>
</head>
<body>

<div class="app">

  <!-- ========== PANTALLA DE LOGIN ========== -->
  <div id="loginScreen" class="login-screen">
    <div class="login-logo">SA</div>
    <h1 class="login-title">Sport Agent</h1>
    <p class="login-subtitle">Tu cuerpo te habla.<br>Yo traduzco.</p>

    <!-- Vista inicial de login (Google + Email) -->
    <div id="loginButtons" class="login-buttons">
      <button class="btn-login" onclick="signInWithGoogle()">
        <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continuar con Google
      </button>
      <button class="btn-login" onclick="showEmailForm()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg>
        Continuar con email
      </button>
    </div>

    <!-- Formulario de email (oculto inicialmente) -->
    <div id="emailForm" class="email-form hidden">
      <input id="emailInput" class="email-input" type="email" placeholder="tu@email.com" autocomplete="email">
      <input id="passwordInput" class="email-input" type="password" placeholder="Contraseña (mínimo 6 caracteres)" autocomplete="current-password">
      <button class="btn-login btn-login-primary" onclick="signInWithEmail()">Entrar / Crear cuenta</button>
      <div id="loginError" class="login-error"></div>
      <button class="login-back" onclick="hideEmailForm()">← Volver</button>
    </div>

    <!-- Loading state durante autenticación -->
    <div id="loginLoading" class="login-loading hidden">
      <div class="spinner"></div>
      <span>Conectando...</span>
    </div>
  </div>

  <!-- ========== ONBOARDING (primer mensaje) ========== -->
  <div id="onboarding" class="onboarding-overlay hidden">
    <h1 class="ob-title">Hola.</h1>
    <p class="ob-subtitle">Soy tu agente.<br>Contame qué pasa hoy y te ayudo a decidir.</p>
    <button class="ob-button" onclick="startChat()">Empezar</button>
  </div>

  <!-- ========== APP PRINCIPAL ========== -->
  <div id="appMain" class="hidden" style="display:none; flex-direction:column; height:100%;">
    <div class="header">
      <div id="avatar" class="avatar">SA</div>
      <div class="header-info">
        <div id="headerName" class="header-title">Sport Agent</div>
        <div id="headerStatus" class="header-status">● En línea</div>
      </div>
      <div class="header-actions">
        <button class="btn-icon" onclick="resetChat()" title="Nueva conversación">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        </button>
        <button class="btn-icon" onclick="signOut()" title="Cerrar sesión">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>

    <div id="conversation" class="conversation">
      <div class="day-marker">Hoy</div>
    </div>

    <div class="input-bar">
      <div class="input-wrap">
        <textarea id="inputField" rows="1" placeholder="Escribí tu mensaje..." autocomplete="off"></textarea>
      </div>
      <button id="sendBtn" class="send-btn" onclick="sendMessage()" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </div>
  </div>

</div>

<script>
// ===============================================
// ⚠️ CONFIGURACIÓN - PEGAR ACÁ TUS CREDENCIALES ⚠️

// ========== FIX TECLADO iOS ==========
function updateAppHeight() {
  const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  document.documentElement.style.setProperty('--app-height', h + 'px');
}

if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => {
    updateAppHeight();
    requestAnimationFrame(() => {
      if (conversation) conversation.scrollTop = conversation.scrollHeight;
    });
  });
}
window.addEventListener('resize', updateAppHeight);
window.addEventListener('orientationchange', () => setTimeout(updateAppHeight, 200));

input.addEventListener('focus', () => {
  setTimeout(() => {
    updateAppHeight();
    conversation.scrollTop = conversation.scrollHeight;

});

// ===============================================
// AUTENTICACIÓN
// ===============================================

async function checkAuthState() {
  // Al cargar, verificar si hay sesión activa
  const { data: { session } } = await supabase.auth.getSession();
  
  if (session) {
    currentUser = session.user;
    await onUserAuthenticated();
  } else {
    showLoginScreen();
  }
}

function showLoginScreen() {
  loginScreen.classList.remove('hidden');
  appMain.style.display = 'none';
  loginButtons.classList.remove('hidden');
  emailForm.classList.add('hidden');
  loginLoading.classList.add('hidden');
}

function showLoginLoading() {
  loginButtons.classList.add('hidden');
  emailForm.classList.add('hidden');
  loginLoading.classList.remove('hidden');
}

function showEmailForm() {
  loginButtons.classList.add('hidden');
  emailForm.classList.remove('hidden');
  loginError.textContent = '';
  document.getElementById('emailInput').focus();
}

function hideEmailForm() {
  emailForm.classList.add('hidden');
  loginButtons.classList.remove('hidden');
  loginError.textContent = '';
}

async function signInWithGoogle() {
  showLoginLoading();
  try {
    const { error } = await supabase.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo: window.location.origin + window.location.pathname
      }
    });
    if (error) throw error;
  } catch (error) {
    console.error('Google sign in error:', error);
    showLoginScreen();
    loginError.textContent = error.message || 'Error al conectar con Google';
  }
}

async function signInWithEmail() {
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  
  if (!email || !password) {
    loginError.textContent = 'Completá email y contraseña';
    return;
  }
  
  if (password.length < 6) {
    loginError.textContent = 'La contraseña debe tener al menos 6 caracteres';
    return;
  }
  
  loginError.textContent = '';
  showLoginLoading();
  
  try {
    // Intentar sign in primero
    let { data, error } = await supabase.auth.signInWithPassword({ email, password });
    
    // Si falla por usuario no existente, intentar sign up
    if (error && error.message.toLowerCase().includes('invalid')) {
      const result = await supabase.auth.signUp({ 
        email, 
        password,
        options: {
          emailRedirectTo: window.location.origin + window.location.pathname
        }
      });
      
      if (result.error) throw result.error;
      data = result.data;
    } else if (error) {
      throw error;
    }
    
    if (data.user) {
      currentUser = data.user;
      await onUserAuthenticated();
    }
  } catch (error) {
    console.error('Email sign in error:', error);
    showLoginScreen();
    showEmailForm();
    loginError.textContent = error.message || 'Error al iniciar sesión';
  }
}

async function signOut() {
  if (!confirm('¿Cerrar sesión?')) return;
  
  await supabase.auth.signOut();
  currentUser = null;
  currentConversationId = null;
  messageHistory = [];
  conversation.innerHTML = '<div class="day-marker">Hoy</div>';
  showLoginScreen();
}

// Listener de cambios de auth (importante para OAuth callback)
supabase.auth.onAuthStateChange(async (event, session) => {
  if (event === 'SIGNED_IN' && session) {
    currentUser = session.user;
    await onUserAuthenticated();
  } else if (event === 'SIGNED_OUT') {
    currentUser = null;
    showLoginScreen();
  }
});

// ===============================================
// DESPUÉS DEL LOGIN
// ===============================================

async function onUserAuthenticated() {
  // Mostrar app principal
  loginScreen.classList.add('hidden');
  appMain.style.display = 'flex';
  appMain.classList.remove('hidden');
  
  // Configurar header con info del usuario
  setupUserHeader();
  
  // Cargar conversación más reciente o crear una nueva
  await loadOrCreateConversation();
}

function setupUserHeader() {
  const meta = currentUser.user_metadata || {};
  const displayName = meta.full_name || meta.name || currentUser.email?.split('@')[0] || 'Usuario';
  const avatarUrl = meta.avatar_url || meta.picture;
  
  headerName.textContent = displayName;
  
  if (avatarUrl) {
    avatar.style.backgroundImage = `url(${avatarUrl})`;
    avatar.textContent = '';
  } else {
    const initials = displayName.split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();
    avatar.textContent = initials;
    avatar.style.backgroundImage = '';
  }
}

async function loadOrCreateConversation() {
  try {
    // Buscar la conversación más reciente del usuario
    const { data: conversations, error } = await supabase
      .from('conversations')
      .select('id')
      .eq('user_id', currentUser.id)
      .order('updated_at', { ascending: false })
      .limit(1);
    
    if (error) throw error;
    
    if (conversations && conversations.length > 0) {
      // Cargar conversación existente
      currentConversationId = conversations[0].id;
      await loadMessages(currentConversationId);
      
      // Si no hay mensajes, mostrar onboarding
      if (messageHistory.length === 0) {
        showOnboarding();
      }
    } else {
      // No hay conversaciones previas: crear una nueva y mostrar onboarding
      await createNewConversation();
      showOnboarding();
    }
  } catch (error) {
    console.error('Error loading conversation:', error);
    // Continuar igual mostrando onboarding
    showOnboarding();
  }
}

async function createNewConversation() {
  const { data, error } = await supabase
    .from('conversations')
    .insert({ user_id: currentUser.id })
    .select()
    .single();
  
  if (error) throw error;
  currentConversationId = data.id;
  return data;
}

async function loadMessages(conversationId) {
  const { data, error } = await supabase
    .from('messages')
    .select('role, content, created_at')
    .eq('conversation_id', conversationId)
    .order('created_at', { ascending: true });
  
  if (error) {
    console.error('Error loading messages:', error);
    return;
  }
  
  messageHistory = data.map(m => ({ role: m.role, content: m.content }));
  
  // Renderizar visualmente los mensajes
  for (const msg of messageHistory) {
    if (msg.role === 'user' && !msg.content.startsWith('[SISTEMA:')) {
      renderUserMessage(msg.content);
    } else if (msg.role === 'assistant') {
      const bubble = createAgentBubble();
      processCompleteResponse(msg.content, bubble);
    }
  }
}

async function saveMessageToDb(role, content) {
  if (!currentConversationId || !currentUser) return;
  
  try {
    await supabase.from('messages').insert({
      conversation_id: currentConversationId,
      user_id: currentUser.id,
      role: role,
      content: content
    });
    
    // Actualizar timestamp de conversación
    await supabase.from('conversations')
      .update({ updated_at: new Date().toISOString() })
      .eq('id', currentConversationId);
  } catch (error) {
    console.error('Error saving message:', error);
  }
}

function showOnboarding() {
  onboarding.classList.remove('hidden');
}

// ===============================================
// HELPERS DE UI (mantenidos de v0.4.2)
// ===============================================

function getTime() {
  const d = new Date();
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

function getDateLabel() {
  const d = new Date();
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return `${d.getDate()} ${meses[d.getMonth()]}`.toUpperCase();
}

function scrollToBottom(smooth = true) {
  setTimeout(() => {
    conversation.scrollTo({ top: conversation.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
  }, 50);
}

function setAgentState(state) {
  avatar.classList.remove('thinking', 'error');
  if (state === 'thinking') {
    avatar.classList.add('thinking');
    headerStatus.textContent = '● Pensando...';
  } else if (state === 'error') {
    avatar.classList.add('error');
    headerStatus.textContent = '● Error de conexión';
  } else {
    headerStatus.textContent = '● En línea';
  }
}

function formatText(text) {
  return text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]);
}

function renderUserMessage(text) {
  const msg = document.createElement('div');
  msg.className = 'msg msg-user';
  msg.innerHTML = `<div class="msg-bubble">${escapeHtml(text)}</div><div class="msg-time">${getTime()}</div>`;
  conversation.appendChild(msg);
  scrollToBottom();
}

function createAgentBubble() {
  const msg = document.createElement('div');
  msg.className = 'msg msg-agent';
  msg.innerHTML = `<div class="msg-bubble"><span class="msg-content"></span><span class="streaming-cursor"></span></div><div class="msg-time">${getTime()}</div>`;
  conversation.appendChild(msg);
  scrollToBottom();
  return { container: msg, content: msg.querySelector('.msg-content'), cursor: msg.querySelector('.streaming-cursor') };
}

function showTypingDots() {
  const t = document.createElement('div');
  t.className = 'typing';
  t.id = 'typingIndicator';
  t.innerHTML = '<span></span><span></span><span></span>';
  conversation.appendChild(t);
  scrollToBottom();
}

function removeTypingDots() {
  const t = document.getElementById('typingIndicator');
  if (t) t.remove();
}

function renderError(message) {
  const msg = document.createElement('div');
  msg.className = 'msg msg-agent msg-error';
  msg.innerHTML = `<div class="msg-bubble">⚠ ${escapeHtml(message)}</div><div class="msg-time">${getTime()}</div>`;
  conversation.appendChild(msg);
  scrollToBottom();
}

// ===============================================
// VERDICT CARD (mantenido de v0.4.2)
// ===============================================

function renderVerdictCardC2(data, parentEl = conversation) {
  const statusMap = {
    go: { color: '#D9F264', label: 'Luz verde' },
    caution: { color: '#FFB800', label: 'Luz amarilla' },
    stop: { color: '#FF4D4D', label: 'Luz roja' }
  };
  const colorSet = statusMap[data.status] || statusMap.caution;
  const mainColor = colorSet.color;
  const labelText = data.label || colorSet.label;

  const gaugeLength = 408.4;
  const intensity = Math.max(0, Math.min(100, data.intensity_percent || 0));
  const gaugeOffset = gaugeLength * (1 - intensity / 100);

  const loadWidth = Math.max(0, Math.min(100, data.load_percent || 0));
  const riskWidth = Math.max(0, Math.min(100, data.risk_percent || 0));
  
  const loadColor = loadWidth > 75 ? '#FF4D4D' : loadWidth > 50 ? '#FFB800' : loadWidth > 30 ? '#FFB800' : '#D9F264';
  const riskColor = riskWidth > 75 ? '#FF4D4D' : riskWidth > 50 ? '#FF4D4D' : riskWidth > 25 ? '#FFB800' : '#D9F264';

  const doItems = (data.do_items || []).slice(0, 4);
  const avoidItems = (data.avoid_items || []).slice(0, 4);

  const card = document.createElement('div');
  card.className = 'verdict';
  card.innerHTML = `
    <div class="v-header">
      <div class="v-status-pill">
        <div class="v-status-dot ${data.status}"></div>
        <span class="v-status-label">${escapeHtml(labelText)}</span>
      </div>
      <span class="v-timestamp">${getDateLabel()} · ${getTime()}</span>
    </div>
    
    <div class="v-gauge">
      <svg viewBox="0 0 280 180" xmlns="http://www.w3.org/2000/svg">
        <path d="M 40 140 A 100 100 0 0 1 240 140" stroke="rgba(255,255,255,0.06)" stroke-width="10" fill="none" stroke-linecap="round"/>
        <path d="M 40 140 A 100 100 0 0 1 240 140" stroke="${mainColor}" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${gaugeLength}" stroke-dashoffset="${gaugeOffset}" style="transition: stroke-dashoffset 0.8s ease;"/>
        <text x="140" y="105" text-anchor="middle" fill="${mainColor}" font-family="Outfit" font-weight="300" font-size="42" letter-spacing="-1">${intensity}<tspan font-size="20" dy="-12">%</tspan></text>
        <text x="140" y="135" text-anchor="middle" fill="#55524e" font-family="Outfit" font-weight="400" font-size="9" letter-spacing="1.5">INTENSIDAD MÁX</text>
      </svg>
    </div>
    
    <div class="v-metrics">
      <div class="v-metric">
        <span class="v-metric-label">Carga</span>
        <div class="v-metric-bar"><div class="v-metric-fill" style="width:${loadWidth}%; background:${loadColor};"></div></div>
        <span class="v-metric-value">${loadWidth}</span>
      </div>
      <div class="v-metric">
        <span class="v-metric-label">Riesgo</span>
        <div class="v-metric-bar"><div class="v-metric-fill" style="width:${riskWidth}%; background:${riskColor};"></div></div>
        <span class="v-metric-value">${riskWidth}</span>
      </div>
    </div>
    
    ${doItems.length > 0 ? `
      <div class="v-section">
        <div class="v-section-label">Hacer</div>
        <div class="v-list">
          ${doItems.map(item => `<div class="v-item do">${escapeHtml(item)}</div>`).join('')}
        </div>
      </div>
    ` : ''}
    
    ${avoidItems.length > 0 ? `
      <div class="v-section">
        <div class="v-section-label">Evitar</div>
        <div class="v-list">
          ${avoidItems.map(item => `<div class="v-item avoid">${escapeHtml(item)}</div>`).join('')}
        </div>
      </div>
    ` : ''}
    
    ${data.warning ? `<div class="v-warning">${escapeHtml(data.warning)}</div>` : ''}
  `;
  parentEl.appendChild(card);
  scrollToBottom();
}

// ===============================================
// PROCESAMIENTO DE RESPUESTAS DEL AGENTE
// ===============================================

function processCompleteResponse(fullText, agentBubble) {
  if (fullText.includes('<<<VERDICT')) {
    try {
      const verdictMatch = fullText.match(/<<<VERDICT\s*([\s\S]+?)\s*VERDICT>>>/);
      if (!verdictMatch) throw new Error('VERDICT markers not properly closed');
      
      const verdictData = JSON.parse(verdictMatch[1]);
      const beforeText = fullText.substring(0, fullText.indexOf('<<<VERDICT')).trim();
      const afterText = fullText.substring(fullText.indexOf('VERDICT>>>') + 'VERDICT>>>'.length).trim();
      
      if (beforeText) {
        agentBubble.content.innerHTML = formatText(beforeText);
      } else {
        agentBubble.container.remove();
      }
      agentBubble.cursor.remove();
      
      renderVerdictCardC2(verdictData);
      if (afterText) {
        const afterBubble = createAgentBubble();
        afterBubble.content.innerHTML = formatText(afterText);
        afterBubble.cursor.remove();
      }
      return fullText;
    } catch (e) {
      console.warn('VERDICT parse error:', e);
      agentBubble.content.innerHTML = formatText(fullText);
      agentBubble.cursor.remove();
    }
  } else {
    agentBubble.content.innerHTML = formatText(fullText);
    agentBubble.cursor.remove();
  }
  return fullText;
}

// ===============================================
// LLAMADA AL WORKER
// ===============================================

async function callAgent(userMessage) {
  messageHistory.push({ role: 'user', content: userMessage });
  
  // Guardar mensaje del usuario en DB (excepto mensajes de sistema)
  if (!userMessage.startsWith('[SISTEMA:')) {
    await saveMessageToDb('user', userMessage);
  } else {
    // Aún así guardamos mensajes de sistema, pero los filtramos al renderizar
    await saveMessageToDb('user', userMessage);
  }
  
  setAgentState('thinking');
  isStreaming = true;
  sendBtn.disabled = true;
  showTypingDots();
  
  let agentBubble = null;
  let fullText = '';
  
  try {
    const response = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: messageHistory }),
    });
    
    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      throw new Error(err.error || `Error ${response.status}`);
    }
    
    removeTypingDots();
    agentBubble = createAgentBubble();
    
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (!data || data === '[DONE]') continue;
        try {
          const event = JSON.parse(data);
          if (event.type === 'content_block_delta' && event.delta?.type === 'text_delta') {
            const chunk = event.delta.text;
            fullText += chunk;
            if (!fullText.includes('<<<VERDICT')) {
              agentBubble.content.innerHTML = formatText(fullText);
              scrollToBottom(false);
            } else {
              const idx = fullText.indexOf('<<<VERDICT');
              const visibleText = fullText.substring(0, idx).trim();
              agentBubble.content.innerHTML = formatText(visibleText);
              agentBubble.cursor.style.background = 'var(--yellow)';
            }
          }
        } catch (e) {}
      }
    }
    
    processCompleteResponse(fullText, agentBubble);
    messageHistory.push({ role: 'assistant', content: fullText });
    
    // Guardar respuesta del agente en DB
    await saveMessageToDb('assistant', fullText);
    
    setAgentState('online');
    
  } catch (error) {
    console.error('Error:', error);
    removeTypingDots();
    if (agentBubble) agentBubble.container.remove();
    let errorMsg = 'No pude conectar con el agente. ';
    if (error.message.includes('Failed to fetch')) errorMsg += 'Revisa tu conexión a internet.';
    else errorMsg += error.message;
    renderError(errorMsg);
    setAgentState('error');
    messageHistory.pop();
  } finally {
    isStreaming = false;
    sendBtn.disabled = input.value.trim() === '';
  }
}

// ===============================================
// CONTROL DE FLUJO
// ===============================================

function startChat() {
  onboarding.classList.add('hidden');
  if (messageHistory.length === 0) {
    setTimeout(() => {
      callAgent('[SISTEMA: El usuario acaba de abrir la app. Saluda brevemente variando la apertura, y haz tu primera pregunta del check-in del día.]');
    }, 400);
  }
}

async function resetChat() {
  if (!confirm('¿Reiniciar conversación? Empezás una nueva (la anterior queda guardada).')) return;
  
  // Crear conversación nueva en DB
  try {
    await createNewConversation();
  } catch (error) {
    console.error('Error creating new conversation:', error);
  }
  
  messageHistory = [];
  conversation.innerHTML = '<div class="day-marker">Hoy</div>';
  
  setTimeout(() => {
    callAgent('[SISTEMA: El usuario reinició la conversación. Saluda brevemente variando la apertura y haz tu primera pregunta del check-in.]');
  }, 300);
}

// ===============================================
// INPUT HANDLERS
// ===============================================

input.addEventListener('input', () => {
  sendBtn.disabled = input.value.trim() === '' || isStreaming;
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 100) + 'px';
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

document.getElementById('emailInput')?.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('passwordInput').focus();
});

document.getElementById('passwordInput')?.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') signInWithEmail();
});

async function sendMessage() {
  const text = input.value.trim();
  if (!text || isStreaming) return;
  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;
  renderUserMessage(text);
  await callAgent(text);
}

// ===============================================
// INICIO DE LA APP
// ===============================================

checkAuthState();
