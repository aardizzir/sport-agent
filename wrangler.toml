compatibility_date = "2024-11-01"
account_id = "e445ed6edcaa26154bd7494f2bc42ff1"

# Cron de Garmin. Cloudflare usa UTC; Santiago es UTC-3 en verano y UTC-4 en
# invierno. Se programan ambas horas y el Worker ignora la que no corresponde.
#   09:30 / 10:30 UTC → 06:30 Santiago (lectura principal)
#   12:30 / 13:30 UTC → 09:30 Santiago (repesca si la banda sincronizó tarde)
[triggers]
crons = ["30 9 * * *", "30 10 * * *", "30 12 * * *", "30 13 * * *"]

